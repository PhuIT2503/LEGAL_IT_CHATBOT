
services:
  neo4j:
    image: neo4j:5.26.27-community
    container_name: legal_kg_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/legal_kg_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Service import KG — chỉ chạy một lần, không cần Python trên host
  kg-ingest:
    image: python:3.11-slim
    container_name: legal_kg_ingest
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal_kg_2024
    volumes:
      - ../src:/app/src:ro
      - ../data:/app/data:ro
      - ../scripts:/app/scripts:ro
    working_dir: /app
    command: >
      bash -c "
        pip install neo4j python-docx --quiet &&
        python scripts/run_neo4j_ingest.py &&
        python scripts/build_cross_references.py
      "
    profiles:
      - ingest   # Chỉ chạy khi gọi: docker compose --profile ingest up kg-ingest

  ollama:
    image: ollama/ollama:latest
    container_name: legal_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Image ứng dụng: đủ deps (torch CPU, sentence-transformers, qdrant-client,
  # langgraph, langchain, neo4j, python-docx) để chạy ingestion và chatbot pipeline.
  # Qdrant chạy ở chế độ embedded/local-file (KHÔNG dùng server riêng) — dữ liệu
  # nằm ngay trong data/.qdrant của repo để dễ đóng gói/chuyển cho người khác.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: legal_app
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal_kg_2024
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen2.5:7b
    volumes:
      - ../src:/app/src:ro
      - ../data:/app/data
      - ../scripts:/app/scripts:ro
      - hf_cache:/root/.cache/huggingface   # cache model embedding — tránh tải lại mỗi lần chạy container --rm
    working_dir: /app
    stdin_open: true
    tty: true
    profiles:
      - app   # Chỉ build/chạy khi gọi: docker compose --profile app run app ...

volumes:
  neo4j_data:
    name: legal_kg_neo4j_data
  neo4j_logs:
    name: legal_kg_neo4j_logs
  ollama_data:
    name: legal_ollama_data
  hf_cache:
    name: legal_app_hf_cache
