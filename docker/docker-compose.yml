
services:
  neo4j:
    image: neo4j:5.26.27-community
    container_name: legal_kg_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/legal_kg_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Service import KG — chỉ chạy một lần, không cần Python trên host
  kg-ingest:
    image: python:3.11-slim
    container_name: legal_kg_ingest
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal_kg_2024
    volumes:
      - ../src:/app/src:ro
      - ../data:/app/data:ro
      - ../scripts:/app/scripts:ro
    working_dir: /app
    command: >
      bash -c "
        pip install neo4j --quiet &&
        python scripts/run_neo4j_ingest.py &&
        python scripts/build_cross_references.py
      "
    profiles:
      - ingest   # Chỉ chạy khi gọi: docker compose --profile ingest up kg-ingest

volumes:
  neo4j_data:
    name: legal_kg_neo4j_data
  neo4j_logs:
    name: legal_kg_neo4j_logs
