
services:
  neo4j:
    image: neo4j:5.26.27-community
    container_name: legal_kg_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/legal_kg_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nạp Knowledge Graph vào Neo4j — KHÔNG có profiles riêng nữa: chạy tự động
  # mỗi khi `docker compose up -d app` (app depends_on kg-ingest hoàn thành
  # bên dưới), không cần gọi tay `--profile ingest` như trước. An toàn để
  # tự chạy lại nhiều lần: run_neo4j_ingest.py dùng MERGE (idempotent, không
  # tạo trùng dữ liệu) — và nếu container này đã "Exited (0)" từ lần trước,
  # Compose thấy điều kiện service_completed_successfully đã thỏa nên KHÔNG
  # chạy lại nữa (không tốn thời gian ingest lại mỗi lần khởi động).
  kg-ingest:
    image: python:3.11-slim
    container_name: legal_kg_ingest
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal_kg_2024
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    # 3 bước, chạy đúng thứ tự này:
    #   1. run_neo4j_ingest.py       — nạp entity/quan hệ do LLM trích xuất sẵn
    #      (data/extracted_json) vào Neo4j.
    #   2. build_cross_references.py — vá cạnh THAM_CHIEU bằng regex trên text
    #      gốc (LLM chỉ thấy trong 1 chunk nên bỏ sót tham chiếu chéo).
    #   3. repair_che_tai_links.py   — vá cạnh CHE_TAI_CHINH/CHE_TAI_BO_SUNG cho
    #      các node chế tài bị bỏ rơi không nối vào HanhVi nào. PHẢI chạy sau
    #      bước 1 (cần node đã có trong graph). Không có bước này thì tín hiệu
    #      "chế tài kép" của Critic Agent chỉ kích hoạt được ở ĐÚNG 1 Điều trên
    #      tổng 1211 Điều (đã đo) — coi như tính năng chết.
    # Cả 3 đều idempotent (MERGE), chạy lại nhiều lần không tạo trùng.
    command: >
      bash -c "
        pip install neo4j python-docx --quiet &&
        python scripts/run_neo4j_ingest.py &&
        python scripts/build_cross_references.py &&
        python scripts/repair_che_tai_links.py --apply
      "

  # Vector DB (Qdrant) chạy như MỘT CONTAINER RIÊNG — thay cho kiểu embedded/
  # local-file trước đây (2 thư mục data/.qdrant_base + data/.qdrant_gte_base
  # nằm ngay trong repo). Dữ liệu giờ nằm trong volume Docker legal_qdrant_data,
  # xem trực tiếp bằng dashboard: http://localhost:6333/dashboard
  #
  # 4 collection (2 model embedding × cặp parent/child của kiến trúc chunking):
  #   legal_child_chunks_base + legal_parent_chunks_base  — Vietnamese_Embedding_v2 (1024d)
  #   legal_child_chunks_gte  + legal_parent_chunks_gte   — gte-multilingual-base (768d)
  # Dữ liệu do service qdrant-ingest bên dưới tự nạp từ data/keep — container
  # này khởi động lên là rỗng, không tự có sẵn gì.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC (không bắt buộc, để sẵn cho client muốn dùng gRPC)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Nạp vector vào container qdrant ở trên — chạy TỰ ĐỘNG khi `docker compose
  # --profile app up -d app` (app depends_on service này hoàn thành), giống
  # kg-ingest. Tự chọn 1 trong 2 đường, không cần ai bấm gì:
  #
  #   ĐƯỜNG NHANH (vài phút) — khi CÓ SẴN data/.qdrant_base và
  #   data/.qdrant_gte_base. Đây là 2 thư mục Qdrant embedded đã ingest xong từ
  #   trước; copy nguyên vector + payload sang server, KHÔNG chạy lại embedding
  #   model. 2 thư mục này nằm trong .gitignore nên không đi theo repo — phải
  #   chép tay vào data/ trước khi chạy.
  #
  #   ĐƯỜNG CHẬM (1-3 tiếng) — khi KHÔNG có 2 thư mục đó. Chunking data/keep
  #   (18 file .docx CÓ trong repo) -> encode dense + fit BM25 -> upsert, chạy
  #   tuần tự 2 model. Nhờ đường này mà chỉ cần clone repo là dựng lại được
  #   toàn bộ vector DB từ số 0, không phụ thuộc file ngoài.
  #
  # Cả 2 đường đều idempotent: chạy lại không nạp trùng. Đường nhanh bỏ qua
  # collection đã có trên server; đường chậm dùng --resume, đối chiếu ID từng
  # batch nên bị ngắt giữa chừng thì chạy lại là đi tiếp. Vì vậy mỗi lần `up`
  # sau, Compose có khởi động lại container này nhưng chỉ tốn ~1 phút.
  qdrant-ingest:
    image: legal_it_chatbot-app:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: legal_qdrant_ingest
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data   # cần quyền GHI: lưu BM25 index vào data/bm25/
      - hf_cache:/root/.cache/huggingface   # dùng chung cache model với app, không tải lại 2 lần
    working_dir: /app
    # Dùng khối `|` (giữ nguyên xuống dòng) chứ KHÔNG dùng `>`: `>` chỉ nối các
    # dòng cùng mức thụt lề, dòng thụt sâu hơn vẫn bị xuống dòng, nên script
    # nhiều dòng viết bằng `>` sẽ vỡ ("--model: command not found").
    command:
      - bash
      - -c
      - |
        set -e
        if [ -d data/.qdrant_base ] && [ -d data/.qdrant_gte_base ]; then
          echo "==> Thấy 2 thư mục Qdrant embedded — copy thẳng sang server (vài phút)"
          python scripts/migrate_qdrant_to_server.py
        else
          echo "==> Không thấy thư mục Qdrant embedded — ingest lại từ data/keep (1-3 tiếng)"
          # Mỗi model embedding = 1 cặp collection RIÊNG (2 không gian embedding
          # khác dimension: 1024 vs 768, TUYỆT ĐỐI không dùng chung tên).
          python src/indexing/qdrant_ingest.py --model AITeamVN/Vietnamese_Embedding_v2 --child-collection legal_child_chunks_base --parent-collection legal_parent_chunks_base --resume
          python src/indexing/qdrant_ingest.py --model Alibaba-NLP/gte-multilingual-base --child-collection legal_child_chunks_gte --parent-collection legal_parent_chunks_gte --resume
        fi

  # Tùy chọn — CHỈ cần nếu muốn chạy Qwen2.5 7B cục bộ (không cần API key). Máy
  # không host được Ollama (vd không đủ RAM/CPU) thì bỏ qua hẳn service này —
  # app vẫn chạy đầy đủ, chỉ cần chọn model qua api.shopaikey (gpt-4o-mini/
  # gpt-5-nano/gpt-4.1-nano, xem .env.example) làm LLM trong khung chat.
  # Chạy khi cần: docker compose --profile ollama up -d ollama
  ollama:
    image: ollama/ollama:latest
    container_name: legal_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - ollama

  # Image ứng dụng: đủ deps (torch CPU, sentence-transformers, qdrant-client,
  # langgraph, langchain, neo4j, python-docx) để chạy ingestion và chatbot pipeline.
  # Vector DB đọc từ service qdrant ở trên (container riêng, không còn embedded).
  app:
    image: legal_it_chatbot-app:latest
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: legal_app
    depends_on:
      neo4j:
        condition: service_healthy
      kg-ingest:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      # Chờ nạp xong vector rồi mới bật chat — nếu không, giao diện lên được
      # nhưng Qdrant còn rỗng và mọi câu hỏi đều trả "Tôi không biết".
      qdrant-ingest:
        condition: service_completed_successfully
      # KHÔNG depends_on ollama — ollama là tùy chọn (xem ghi chú ở service
      # ollama phía trên), app phải chạy được kể cả khi không có container đó.
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=legal_kg_2024
      # Trong mạng Docker gọi thẳng service qdrant qua cổng nội bộ 6333; từ máy
      # host (chạy app ngoài Docker) thì là http://localhost:6333.
      - QDRANT_URL=http://qdrant:6333
      # Chỉ có tác dụng nếu bạn CÓ chạy service ollama ở trên (profile ollama)
      # và chọn Qwen2.5 7B trong khung chat — không có thì bỏ qua, dùng model
      # qua api.shopaikey thay thế.
      # Có thể trỏ tới Ollama.app trên máy host qua .env:
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA_MODEL=qwen2.5:7b
      # Đăng nhập demo cho giao diện chat (đổi CHAINLIT_DEMO_USER/PASSWORD nếu
      # muốn) — bắt buộc phải có để Chainlit hiển thị lịch sử chat.
      - CHAINLIT_AUTH_SECRET=?41w/G4s.hdlqlID=u60:jmq*s~K:%G16K2qI-9V8no9VHM3bRJSx,4,O4g8bDHW
    # OPENAI_API_KEY (cần để dùng các model LLM qua api.shopaikey — gpt-4o-mini/
    # gpt-5-nano/gpt-4.1-nano — chọn được trong bảng Cài đặt của app.py) đọc từ
    # file .env cùng thư mục docker-compose.yml (thư mục gốc repo). Qwen2.5 7B
    # qua Ollama không cần biến này.
    env_file:
      # required: false — máy vừa clone repo về chưa có .env thì Compose VẪN
      # chạy (chỉ là chưa chat được cho tới khi điền key). Nếu để dạng ngắn
      # `- .env`, Compose báo "env file .env not found" và dừng ngay từ đầu.
      - path: .env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./app.py:/app/app.py:ro
      - ./chainlit.md:/app/chainlit.md:ro
      - hf_cache:/root/.cache/huggingface   # cache model embedding — tránh tải lại mỗi lần chạy container --rm
    working_dir: /app
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"   # Giao diện chat Chainlit
    # Mặc định chạy giao diện chat khi `docker compose up -d app` (hiện trong Docker
    # Desktop y như neo4j/ollama). `docker compose run --rm app <lệnh khác>` (vd chạy
    # script Python) vẫn ghi đè command này bình thường, không ảnh hưởng gì.
    command: ["chainlit", "run", "app.py", "--host", "0.0.0.0", "--port", "8000", "--headless"]
    profiles:
      - app   # Chỉ build/chạy khi gọi: docker compose --profile app run app ...

volumes:
  qdrant_data:
    name: legal_qdrant_data
  neo4j_data:
    name: legal_kg_neo4j_data
  neo4j_logs:
    name: legal_kg_neo4j_logs
  ollama_data:
    name: legal_ollama_data
  hf_cache:
    name: legal_app_hf_cache
